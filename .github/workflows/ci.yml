name: Eventix CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Run unit tests
        run: dotnet test Eventix.Tests/Eventix.UnitTests/Eventix.UnitTests.csproj --no-build

      - name: Run integration tests
        run: dotnet test Eventix.Tests/Eventix.IntegrationTests/Eventix.IntegrationTests.csproj --no-build

      - name: Run API tests
        run: dotnet test Eventix.Tests/Eventix.ApiTests/Eventix.ApiTests.csproj --no-build