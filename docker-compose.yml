services:
  postgres:
    image: postgres:16-alpine
    container_name: eventix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: EventManagementDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: BORVYdb2026SSH!
    ports:
      - "5432:5432"
    volumes:
      - eventix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EventManagementDB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eventix-postgres-data:
